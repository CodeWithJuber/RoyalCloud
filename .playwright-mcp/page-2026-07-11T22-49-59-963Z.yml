    - generic [ref=f27e94]:
      - text: Why Voltra
      - heading "Everything your site needs to be fast, safe, and always on." [level=2] [ref=f27e95]
      - paragraph [ref=f27e96]: No upsells for the essentials. SSL, backups, migration, and a CDN are included on every single plan — from day one.
    - generic [ref=f27e97]:
      - article [ref=f27e98]:
        - heading "NVMe + LiteSpeed" [level=3] [ref=f27e102]
        - paragraph [ref=f27e103]: Pure-NVMe storage and LiteSpeed caching deliver page loads up to 10× faster than legacy shared hosts.
      - article [ref=f27e104]:
        - heading "Free SSL & DDoS shield" [level=3] [ref=f27e108]
        - paragraph [ref=f27e109]: Automatic SSL certificates and an always-on DDoS mitigation layer keep every visitor — and your data — protected.
      - article [ref=f27e110]:
        - heading "99.99% uptime SLA" [level=3] [ref=f27e115]
        - paragraph [ref=f27e116]: Backed in writing. If we miss it, you get credited automatically — no support tickets, no arguing.
      - article [ref=f27e117]:
        - heading "Automated daily backups" [level=3] [ref=f27e122]
        - paragraph [ref=f27e123]: Every site is backed up daily with 30-day retention and one-click restore. Roll back a bad deploy in seconds.
      - article [ref=f27e124]:
        - heading "Free managed migration" [level=3] [ref=f27e130]
        - paragraph [ref=f27e131]: Already hosted elsewhere? Our team moves your site — files, database, email — in hours, with zero downtime.
      - article [ref=f27e132]:
        - heading "24/7 human support" [level=3] [ref=f27e136]
        - paragraph [ref=f27e137]: Real engineers, not scripts, available around the clock by chat and ticket — with a median first reply under 2 minutes.
