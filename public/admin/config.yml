      - {
          name: vps,
          label: "KVM VPS Hosting",
          file: "src/data/plans/vps.json",
          fields: *planFields,
        }
      - {
          name: cyberpanel,
          label: "CyberPanel VPS",
          file: "src/data/plans/cyberpanel.json",
          fields: *planFields,
