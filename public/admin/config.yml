# Decap CMS configuration — the visual editor served at /admin.
# Edits are committed straight to the GitHub repo, which triggers the
# build & deploy to Cloudflare.
#
# Auth: GitHub backend (connect an OAuth provider so editors can log in —
# see README → "Editing content with the CMS"). To preview the CMS locally,
# run `npx decap-server` and uncomment `local_backend: true`.

backend:
  name: github
  repo: codewithjuber/royalfront
  branch: main
  # Login uses the GitHub OAuth proxy built into the Cloudflare Worker
  # (src/worker.ts → /oauth/auth + /oauth/callback). base_url MUST be the same
  # origin that serves /admin. When the custom domain is attached, update
  # base_url here AND the GitHub OAuth App's callback URL together
  # (to https://royalclouds.net).
  base_url: https://royalfront.hostlelo.workers.dev
  auth_endpoint: /oauth/auth
  auth_scope: repo
  commit_messages:
    create: "content: create {{collection}} “{{slug}}”"
    update: "content: update {{collection}} “{{slug}}”"
    delete: "content: delete {{collection}} “{{slug}}”"
    uploadMedia: "content: upload {{path}}"
    deleteMedia: "content: delete {{path}}"

# local_backend: true   # uncomment + run `npx decap-server` for local editing

media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"

publish_mode: editorial_workflow

# ---------------------------------------------------------------------------
# Reusable field definitions (YAML anchors)
# ---------------------------------------------------------------------------
definitions:
  cta_object: &ctaObject
    widget: object
    required: false
    fields:
      - { name: text, label: "Button Text", widget: string }
      - { name: href, label: "Link URL or /path", widget: string }
      - {
          name: external,
          label: "Open in new tab",
          widget: boolean,
          default: false,
          required: false,
        }

  page_fields: &pageFields
    - name: title
      label: "Internal Title"
      widget: string
      hint: "Shown in the CMS and used as the H1 fallback / breadcrumb label."
    - name: metadata
      label: "SEO Metadata"
      widget: object
      fields:
        - {
            name: title,
            label: "SEO Title (<title>)",
            widget: string,
            hint: "50–60 chars. The exact text shown in Google's result.",
          }
        - {
            name: description,
            label: "Meta Description",
            widget: text,
            hint: "150–160 chars.",
          }
        - {
            name: ignoreTitleTemplate,
            label: "Use exact title (don't append “— Royal Clouds”)",
            widget: boolean,
            default: true,
          }
        - {
            name: canonical,
            label: "Canonical URL override",
            widget: string,
            required: false,
            hint: "Leave blank to self-canonicalize. Use to point a near-duplicate page at its primary page.",
          }
        - {
            name: noindex,
            label: "Hide from search engines",
            widget: boolean,
            default: false,
            required: false,
          }
    - name: transparentHeader
      label: "Transparent header over hero"
      widget: boolean
      default: true
      required: false
      hint: "On for pages whose first section is a dark/gradient hero."
    - name: newsletter
      label: "Show newsletter signup"
      widget: boolean
      default: false
      required: false
      hint: "Show the newsletter band above the footer (homepage only)."
    - name: redirect
      label: "Redirect URL"
      widget: string
      required: false
      hint: "If set, this page immediately redirects here (e.g. the login page)."
    - name: breadcrumb
      label: "Breadcrumb trail (parents)"
      widget: list
      required: false
      summary: "{{fields.text}}"
      fields:
        - { name: text, label: "Label", widget: string }
        - { name: href, label: "Link", widget: string }
    - name: sections
      label: "Page Sections"
      label_singular: "Section"
      widget: list
      types:
        # ---- Hero ----
        - name: hero
          label: "Hero"
          summary: "Hero — {{fields.title}}"
          fields:
            - {
                name: variant,
                label: "Style",
                widget: select,
                options: ["gradient", "product", "simple"],
                default: "product",
              }
            - {
                name: eyebrow,
                label: "Eyebrow",
                widget: string,
                required: false,
              }
            - {
                name: title,
                label: "Heading (HTML/<em> allowed)",
                widget: string,
              }
            - {
                name: subtitle,
                label: "Subtitle",
                widget: text,
                required: false,
              }
            - {
                name: offer,
                label: "Offer line",
                widget: string,
                required: false,
              }
            - {
                name: art,
                label: "Hero illustration (il-shared, il-vps, il-dedicated, …)",
                widget: string,
                required: false,
              }
            - { name: primaryCta, label: "Primary Button", <<: *ctaObject }
            - { name: secondaryCta, label: "Secondary Button", <<: *ctaObject }
            - {
                name: badges,
                label: "Trust Badges",
                widget: list,
                required: false,
              }
        # ---- Trust bar ----
        - name: trustbar
          label: "Trust Bar"
          summary: "Trust bar ({{fields.items.length}} items)"
          fields:
            - name: items
              label: "Items"
              widget: list
              summary: "{{fields.text}}"
              fields:
                - { name: icon, label: "Icon", widget: string, required: false }
                - { name: text, label: "Text", widget: string }
        # ---- Pricing ----
        - name: pricing
          label: "Pricing Table"
          summary: "Pricing — {{fields.plan}}"
          fields:
            - {
                name: id,
                label: "Anchor id",
                widget: string,
                default: "pricing",
                required: false,
              }
            - {
                name: plan,
                label: "Plan",
                widget: select,
                options:
                  [
                    "shared",
                    "cpanel",
                    "vps",
                    "cyberpanel",
                    "wordpress",
                    "cloud",
                    "dedicated",
                    "reseller",
                  ],
              }
            - {
                name: eyebrow,
                label: "Eyebrow",
                widget: string,
                required: false,
              }
            - { name: title, label: "Heading", widget: string, required: false }
            - {
                name: subtitle,
                label: "Subtitle",
                widget: text,
                required: false,
              }
            - {
                name: showToggle,
                label: "Show monthly/annual toggle",
                widget: boolean,
                default: true,
              }
            - {
                name: note,
                label: "Note under prices",
                widget: string,
                required: false,
              }
        # ---- Features ----
        - name: features
          label: "Feature Grid"
          summary: "Features — {{fields.title}}"
          fields:
            - { name: id, label: "Anchor id", widget: string, required: false }
            - {
                name: eyebrow,
                label: "Eyebrow",
                widget: string,
                required: false,
              }
            - { name: title, label: "Heading", widget: string, required: false }
            - {
                name: subtitle,
                label: "Subtitle",
                widget: text,
                required: false,
              }
            - {
                name: columns,
                label: "Columns",
                widget: number,
                default: 3,
                min: 2,
                max: 4,
              }
            - {
                name: variant,
                label: "Card style",
                widget: select,
                options: ["cards", "tiles"],
                required: false,
              }
            - name: items
              label: "Features"
              widget: list
              summary: "{{fields.title}}"
              fields:
                - { name: icon, label: "Icon", widget: string, required: false }
                - { name: title, label: "Title", widget: string }
                - { name: text, label: "Text", widget: text, required: false }
                - {
                    name: href,
                    label: "Link (card links to this URL)",
                    widget: string,
                    required: false,
                  }
        # ---- Content split ----
        - name: content
          label: "Content + Media"
          summary: "Content — {{fields.title}}"
          fields:
            - {
                name: eyebrow,
                label: "Eyebrow",
                widget: string,
                required: false,
              }
            - { name: title, label: "Heading", widget: string, required: false }
            - {
                name: subtitle,
                label: "Subtitle",
                widget: text,
                required: false,
              }
            - {
                name: image,
                label: "Image",
                widget: image,
                required: false,
                choose_url: true,
                hint: "Upload/pick an image — or type a bundled keyword (hero, datacenter, support, working, mascot) via 'Insert from URL'.",
              }
            - {
                name: reverse,
                label: "Image on right",
                widget: boolean,
                default: false,
              }
            - {
                name: layout,
                label: "Bullet layout",
                widget: select,
                options: ["chips", "list"],
                required: false,
              }
            - {
                name: body,
                label: "Body (Markdown)",
                widget: markdown,
                required: false,
              }
            - name: items
              label: "Bullet Points"
              widget: list
              required: false
              summary: "{{fields.title}}"
              fields:
                - { name: icon, label: "Icon", widget: string, required: false }
                - { name: title, label: "Title", widget: string }
                - { name: text, label: "Text", widget: text }
        # ---- Steps ----
        - name: steps
          label: "Steps / Process"
          summary: "Steps — {{fields.title}}"
          fields:
            - {
                name: eyebrow,
                label: "Eyebrow",
                widget: string,
                required: false,
              }
            - { name: title, label: "Heading", widget: string, required: false }
            - {
                name: subtitle,
                label: "Subtitle",
                widget: text,
                required: false,
              }
            - name: items
              label: "Steps"
              widget: list
              summary: "{{fields.title}}"
              fields:
                - { name: icon, label: "Icon", widget: string, required: false }
                - { name: title, label: "Title", widget: string }
                - { name: text, label: "Text", widget: text }
        # ---- Stats ----
        - name: stats
          label: "Stats Band"
          summary: "Stats band"
          fields:
            - name: items
              label: "Stats"
              widget: list
              summary: "{{fields.value}} {{fields.label}}"
              fields:
                - { name: value, label: "Value", widget: string }
                - { name: label, label: "Label", widget: string }
        # ---- Comparison ----
        - name: comparison
          label: "Comparison Table"
          summary: "Comparison — {{fields.plan}}"
          fields:
            - {
                name: eyebrow,
                label: "Eyebrow",
                widget: string,
                required: false,
              }
            - { name: title, label: "Heading", widget: string, required: false }
            - {
                name: subtitle,
                label: "Subtitle",
                widget: text,
                required: false,
              }
            - {
                name: plan,
                label: "Plan",
                widget: select,
                options:
                  [
                    "shared",
                    "cpanel",
                    "vps",
                    "cyberpanel",
                    "wordpress",
                    "cloud",
                    "dedicated",
                    "reseller",
                  ],
              }
            - { name: note, label: "Note", widget: string, required: false }
        # ---- Testimonials ----
        - name: testimonials
          label: "Testimonials"
          summary: "Testimonials — {{fields.title}}"
          fields:
            - {
                name: eyebrow,
                label: "Eyebrow",
                widget: string,
                required: false,
              }
            - { name: title, label: "Heading", widget: string, required: false }
            - {
                name: subtitle,
                label: "Subtitle",
                widget: text,
                required: false,
              }
            - {
                name: source,
                label: "Source",
                widget: select,
                options: ["global", "inline"],
                default: "global",
              }
            - {
                name: limit,
                label: "Max to show",
                widget: number,
                required: false,
                min: 1,
              }
            - name: items
              label: "Inline Testimonials (only if source = inline)"
              widget: list
              required: false
              summary: "{{fields.name}}"
              fields:
                - { name: name, label: "Name", widget: string }
                - {
                    name: site,
                    label: "Website",
                    widget: string,
                    required: false,
                  }
                - {
                    name: rating,
                    label: "Rating",
                    widget: number,
                    default: 5,
                    min: 1,
                    max: 5,
                  }
                - { name: quote, label: "Quote", widget: text }
        # ---- FAQ ----
        - name: faq
          label: "FAQ Accordion"
          summary: "FAQ — {{fields.title}}"
          fields:
            - {
                name: eyebrow,
                label: "Eyebrow",
                widget: string,
                required: false,
              }
            - { name: title, label: "Heading", widget: string, required: false }
            - {
                name: subtitle,
                label: "Subtitle",
                widget: text,
                required: false,
              }
            - {
                name: source,
                label: "Source",
                widget: select,
                options: ["global", "inline"],
                default: "global",
              }
            - {
                name: jsonld,
                label: "Emit FAQ structured data",
                widget: boolean,
                default: true,
              }
            - name: items
              label: "Inline Q&A (only if source = inline)"
              widget: list
              required: false
              summary: "{{fields.q}}"
              fields:
                - { name: q, label: "Question", widget: string }
                - { name: a, label: "Answer", widget: text }
        # ---- Domain search ----
        - name: domainsearch
          label: "Domain Search"
          summary: "Domain search"
          fields:
            - {
                name: eyebrow,
                label: "Eyebrow",
                widget: string,
                required: false,
              }
            - { name: title, label: "Heading", widget: string, required: false }
            - {
                name: subtitle,
                label: "Subtitle",
                widget: text,
                required: false,
              }
        # ---- Tech logos ----
        - name: techlogos
          label: "Technology Logos"
          summary: "Tech logos"
          fields:
            - {
                name: eyebrow,
                label: "Eyebrow",
                widget: string,
                required: false,
              }
            - { name: title, label: "Heading", widget: string, required: false }
            - {
                name: subtitle,
                label: "Subtitle",
                widget: text,
                required: false,
              }
            - {
                name: logos,
                label: "Logo slugs (iconify logos)",
                widget: list,
                required: false,
              }
        # ---- CTA band ----
        - name: cta
          label: "Call To Action"
          summary: "CTA — {{fields.title}}"
          fields:
            - { name: title, label: "Heading", widget: string }
            - {
                name: subtitle,
                label: "Subtitle",
                widget: text,
                required: false,
              }
            - { name: primaryCta, label: "Primary Button", <<: *ctaObject }
            - { name: secondaryCta, label: "Secondary Button", <<: *ctaObject }
        # ---- Benchmark bars ----
        - name: benchmark
          label: "Benchmark / Ratings Bars"
          summary: "Benchmark — {{fields.title}}"
          fields:
            - {
                name: eyebrow,
                label: "Eyebrow",
                widget: string,
                required: false,
              }
            - { name: title, label: "Heading", widget: string, required: false }
            - {
                name: subtitle,
                label: "Subtitle",
                widget: text,
                required: false,
              }
            - { name: note, label: "Footnote", widget: string, required: false }
            - name: items
              label: "Bars"
              widget: list
              summary: "{{fields.label}} — {{fields.display}}"
              fields:
                - { name: label, label: "Label", widget: string }
                - {
                    name: value,
                    label: "Value (number, sets bar length)",
                    widget: number,
                    value_type: float,
                  }
                - { name: display, label: "Displayed value", widget: string }
                - {
                    name: highlight,
                    label: "Highlight",
                    widget: boolean,
                    default: false,
                    required: false,
                  }
        # ---- Speed race ----
        - name: race
          label: "Speed Race"
          summary: "Speed race — {{fields.title}}"
          fields:
            - {
                name: eyebrow,
                label: "Eyebrow",
                widget: string,
                required: false,
              }
            - { name: title, label: "Heading", widget: string, required: false }
            - {
                name: subtitle,
                label: "Subtitle",
                widget: text,
                required: false,
              }
            - { name: note, label: "Footnote", widget: string, required: false }
            - name: items
              label: "Racers"
              widget: list
              summary: "{{fields.label}} — {{fields.display}}"
              fields:
                - { name: label, label: "Label", widget: string }
                - {
                    name: value,
                    label: "Relative speed (number)",
                    widget: number,
                    value_type: float,
                  }
                - { name: display, label: "Displayed value", widget: string }
                - {
                    name: highlight,
                    label: "Highlight",
                    widget: boolean,
                    default: false,
                    required: false,
                  }
        # ---- Security layers ----
        - name: security
          label: "Security Layers"
          summary: "Security — {{fields.title}}"
          fields:
            - {
                name: eyebrow,
                label: "Eyebrow",
                widget: string,
                required: false,
              }
            - { name: title, label: "Heading", widget: string, required: false }
            - {
                name: subtitle,
                label: "Subtitle",
                widget: text,
                required: false,
              }
            - name: layers
              label: "Layers"
              widget: list
              summary: "{{fields.title}}"
              fields:
                - { name: title, label: "Title", widget: string }
                - { name: text, label: "Text", widget: text }
            - name: stats
              label: "Stats (optional)"
              widget: list
              required: false
              summary: "{{fields.value}} {{fields.label}}"
              fields:
                - { name: value, label: "Value", widget: string }
                - { name: label, label: "Label", widget: string }
        # ---- OS strip ----
        - name: osstrip
          label: "OS Strip"
          summary: "OS strip — {{fields.title}}"
          fields:
            - {
                name: eyebrow,
                label: "Eyebrow",
                widget: string,
                required: false,
              }
            - { name: title, label: "Heading", widget: string, required: false }
            - {
                name: subtitle,
                label: "Subtitle",
                widget: text,
                required: false,
              }
            - name: items
              label: "Operating systems"
              widget: list
              summary: "{{fields.name}}"
              fields:
                - { name: name, label: "Name", widget: string }
                - {
                    name: color,
                    label: "Accent color (CSS)",
                    widget: string,
                    required: false,
                  }
                - {
                    name: active,
                    label: "Active",
                    widget: boolean,
                    default: false,
                    required: false,
                  }
        # ---- Map band ----
        - name: mapband
          label: "Datacenter Map"
          summary: "Map — {{fields.title}}"
          fields:
            - {
                name: eyebrow,
                label: "Eyebrow",
                widget: string,
                required: false,
              }
            - { name: title, label: "Heading", widget: string, required: false }
            - {
                name: subtitle,
                label: "Subtitle",
                widget: text,
                required: false,
              }
            - { name: note, label: "Footnote", widget: string, required: false }
            - name: pins
              label: "Location pins"
              widget: list
              required: false
              summary: "{{fields.label}}"
              fields:
                - { name: label, label: "Label", widget: string }
                - {
                    name: x,
                    label: "X position (0–100)",
                    widget: number,
                    value_type: float,
                  }
                - {
                    name: y,
                    label: "Y position (0–100)",
                    widget: number,
                    value_type: float,
                  }
                - {
                    name: live,
                    label: "Live",
                    widget: boolean,
                    default: false,
                    required: false,
                  }
        # ---- Showcase tabs ----
        - name: showcase
          label: "Showcase Tabs"
          summary: "Showcase — {{fields.title}}"
          fields:
            - {
                name: eyebrow,
                label: "Eyebrow",
                widget: string,
                required: false,
              }
            - { name: title, label: "Heading", widget: string, required: false }
            - {
                name: subtitle,
                label: "Subtitle",
                widget: text,
                required: false,
              }
            - name: tabs
              label: "Tabs"
              widget: list
              required: false
              summary: "{{fields.label}}"
              fields:
                - { name: label, label: "Tab label", widget: string }
                - {
                    name: panel,
                    label: "Panel",
                    widget: select,
                    options: ["files", "ssl", "backups", "stats"],
                  }
                - {
                    name: text,
                    label: "Caption",
                    widget: text,
                    required: false,
                  }
    - name: body
      label: "Long-form Body (Markdown — for legal/policy pages)"
      widget: markdown
      required: false

collections:
  # ---------------- Site Pages (core + products) ----------------
  - name: pages
    label: "Site Pages"
    label_singular: "Page"
    folder: "src/data/pages"
    create: true
    delete: false
    slug: "{{slug}}"
    extension: md
    format: frontmatter-with-body
    preview_path: "{{slug}}"
    summary: "{{title}}"
    fields: *pageFields

  # ---------------- Landing Pages (SEO long-tail) ----------------
  - name: landing
    label: "Landing Pages"
    label_singular: "Landing Page"
    folder: "src/data/landing"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter-with-body
    preview_path: "{{slug}}"
    summary: "{{title}}"
    fields: *pageFields

  # ---------------- Navigation ----------------
  - name: navigation
    label: "Navigation (Header & Footer)"
    files:
      - name: navigation
        label: "Header & Footer Links"
        file: "src/data/navigation.json"
        fields:
          - name: header
            label: "Header"
            widget: object
            fields:
              - name: groups
                label: "Dropdown Menus"
                widget: list
                summary: "{{fields.text}}"
                fields:
                  - { name: text, label: "Menu Label", widget: string }
                  - name: links
                    label: "Links"
                    widget: list
                    summary: "{{fields.text}}"
                    fields:
                      - { name: text, label: "Text", widget: string }
                      - { name: href, label: "Link", widget: string }
                      - {
                          name: icon,
                          label: "Icon (mega-menu)",
                          widget: string,
                          required: false,
                        }
                      - {
                          name: description,
                          label: "Description (mega-menu)",
                          widget: string,
                          required: false,
                        }
              - name: links
                label: "Top-level Links"
                widget: list
                summary: "{{fields.text}}"
                fields:
                  - { name: text, label: "Text", widget: string }
                  - { name: href, label: "Link", widget: string }
              - name: actions
                label: "Header Buttons"
                widget: list
                summary: "{{fields.text}}"
                fields:
                  - { name: text, label: "Text", widget: string }
                  - { name: href, label: "Link", widget: string }
                  - {
                      name: variant,
                      label: "Variant",
                      widget: select,
                      options: ["primary", "secondary"],
                      required: false,
                    }
          - name: footer
            label: "Footer"
            widget: object
            fields:
              - name: columns
                label: "Link Columns"
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: "Column Title", widget: string }
                  - name: links
                    label: "Links"
                    widget: list
                    summary: "{{fields.text}}"
                    fields:
                      - { name: text, label: "Text", widget: string }
                      - { name: href, label: "Link", widget: string }
              - name: secondaryLinks
                label: "Legal Links"
                widget: list
                summary: "{{fields.text}}"
                fields:
                  - { name: text, label: "Text", widget: string }
                  - { name: href, label: "Link", widget: string }
              - name: socialLinks
                label: "Social Links"
                widget: list
                summary: "{{fields.ariaLabel}}"
                fields:
                  - { name: ariaLabel, label: "Label", widget: string }
                  - { name: icon, label: "Icon (tabler:*)", widget: string }
                  - { name: href, label: "Link", widget: string }
              - { name: footNote, label: "Footer Note (HTML)", widget: string }

  # ---------------- Blog ----------------
  - name: blog
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "src/data/post"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview_path: "blog/{{slug}}"
    summary: "{{title}} — {{publishDate}}"
    sortable_fields: ["publishDate", "title"]
    fields:
      - {
          name: title,
          label: "Title",
          widget: string,
          hint: "Used as the SEO <title> and H1.",
        }
      - {
          name: excerpt,
          label: "Excerpt / Meta Description",
          widget: text,
          hint: "150–160 chars. Shown in Google results & social shares.",
        }
      - {
          name: publishDate,
          label: "Publish Date",
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
          picker_utc: true,
        }
      - {
          name: updateDate,
          label: "Updated Date",
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
          picker_utc: true,
          required: false,
        }
      - {
          name: author,
          label: "Author",
          widget: string,
          default: "Royal Clouds Team",
        }
      - {
          name: category,
          label: "Category",
          widget: string,
          default: "Hosting",
        }
      - {
          name: tags,
          label: "Tags",
          widget: list,
          default: [],
          required: false,
        }
      - {
          name: image,
          label: "Featured Image",
          widget: image,
          required: false,
          hint: "Used for social cards and the article header.",
        }
      - {
          name: draft,
          label: "Draft (don't publish)",
          widget: boolean,
          default: false,
        }
      - { name: body, label: "Content", widget: markdown }

  # ---------------- Hosting Plans ----------------
  - name: plans
    label: "Hosting Plans & Pricing"
    label_singular: "Hosting Plan"
