  # ---------------- Integrations & Tracking ----------------
  # Analytics, tag managers, verification, pixels, live chat, and arbitrary
  # head/body scripts — all editable here, rendered by src/components/integrations/*.
  # Every field is optional; blank = nothing injected (site stays unchanged).
  - name: integrations
    label: "Integrations & Tracking"
    files:
      - name: integrations
        label: "Analytics, Pixels, Chat & Custom Code"
        file: "src/data/integrations.json"
        fields:
          - name: analytics
            label: "Analytics"
            widget: object
            fields:
              - {
                  name: ga4Id,
                  label: "Google Analytics 4 ID",
                  widget: string,
                  required: false,
                  hint: "Format G-XXXXXXX. Leave blank to disable.",
                }
              - {
                  name: gtmId,
                  label: "Google Tag Manager ID",
                  widget: string,
                  required: false,
                  hint: "Format GTM-XXXXXXX. Leave blank to disable.",
                }
          - name: verification
            label: "Search Console Verification"
            widget: object
            fields:
              - {
                  name: google,
                  label: "Google site-verification token",
                  widget: string,
                  required: false,
                  hint: "The content value of the google-site-verification meta tag (token only).",
                }
              - {
                  name: bing,
                  label: "Bing (msvalidate.01) token",
                  widget: string,
                  required: false,
                }
          - name: pixels
            label: "Marketing Pixels"
            widget: object
            fields:
              - {
                  name: facebookPixelId,
                  label: "Facebook / Meta Pixel ID",
                  widget: string,
                  required: false,
                }
          - name: chat
            label: "Live Chat"
            widget: object
            fields:
              - {
                  name: provider,
                  label: "Provider",
                  widget: select,
                  options: ["none", "tawk", "custom"],
                  default: "none",
                }
              - {
                  name: tawkPropertyId,
                  label: "Tawk.to Property ID",
                  widget: string,
                  required: false,
                  hint: "Used only when Provider = tawk.",
                }
              - {
                  name: tawkWidgetId,
                  label: "Tawk.to Widget ID",
                  widget: string,
                  default: "default",
                  required: false,
                }
              - {
                  name: customEmbed,
                  label: "Custom chat embed (raw HTML/JS)",
                  widget: code,
                  required: false,
                  default_language: html,
                  allow_language_selection: false,
                  hint: "Used only when Provider = custom. Paste the full snippet (Crisp, WhatsApp, Intercom, …).",
                }
          - {
              name: customHeadHtml,
              label: "Custom <head> code (raw HTML/JS)",
              widget: code,
              required: false,
              default_language: html,
              allow_language_selection: false,
              hint: "Injected into <head> on every page. Runs verbatim — paste only trusted code.",
            }
          - {
              name: customBodyHtml,
              label: "Custom end-of-<body> code (raw HTML/JS)",
              widget: code,
              required: false,
              default_language: html,
              allow_language_selection: false,
              hint: "Injected just before </body> on every page. Runs verbatim — paste only trusted code.",
            }

