      - name: shared
        label: "SSD Shared Hosting"
        file: "src/data/plans/shared.json"
        fields: &planFields
          - { name: id, label: "ID (do not change)", widget: hidden }
          - { name: slug, label: "Slug", widget: hidden, required: false }
          - { name: icon, label: "Icon", widget: string, required: false }
          - { name: name, label: "Product Name", widget: string }
          - { name: eyebrow, label: "Eyebrow Label", widget: string }
          - { name: title, label: "Page Heading", widget: string }
          - { name: subtitle, label: "Page Subtitle", widget: text }
          - {
              name: currency,
              label: "Currency Symbol",
              widget: string,
              default: "$",
            }
          - {
              name: billingNote,
              label: "Billing Note",
              widget: string,
              required: false,
            }
          - name: tiers
            label: "Pricing Tiers"
            widget: list
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - { name: name, label: "Tier Name", widget: string }
              - { name: price, label: "Monthly Price", widget: string }
              - {
                  name: priceAnnual,
                  label: "Annual Price (per month, billed yearly)",
                  widget: string,
                  required: false,
                }
              - {
                  name: period,
                  label: "Period",
                  widget: string,
                  default: "/mo",
                }
              - {
                  name: popular,
                  label: "Most Popular",
                  widget: boolean,
                  default: false,
                }
              - {
                  name: summary,
                  label: "Short Summary",
                  widget: string,
                  required: false,
                }
              - {
                  name: cta,
                  label: "Button Label",
                  widget: string,
                  default: "Get Started",
                }
              - {
                  name: ctaUrl,
                  label: "Button URL (order link)",
                  widget: string,
