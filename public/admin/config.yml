          fields: *planFields,
        }
      - {
          name: cloud,
          label: "Managed Cloud",
          file: "src/data/plans/cloud.json",
          fields: *planFields,
        }
      - {
          name: dedicated,
          label: "Dedicated Servers",
          file: "src/data/plans/dedicated.json",
          fields: *planFields,
        }
      - {
          name: reseller,
          label: "Reseller Hosting",
