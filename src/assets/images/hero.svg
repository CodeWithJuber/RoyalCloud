<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1100" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19c08a"/><stop offset="0.5" stop-color="#12a150"/><stop offset="1" stop-color="#0e8a45"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12a150" stop-opacity="0.35"/><stop offset="1" stop-color="#12a150" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#0c2a1c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- soft brand blobs -->
  <circle cx="850" cy="180" r="260" fill="#12a150" opacity="0.10"/>
  <circle cx="220" cy="700" r="220" fill="#0ea5e9" opacity="0.10"/>

  <!-- cloud mark -->
  <g transform="translate(120,120)" opacity="0.95">
    <rect width="150" height="150" rx="40" fill="url(#g1)"/>
    <path d="M44 62l13 12 11-17 8 19 11-17 13 12-4 15H48z" fill="#fff" fill-opacity="0.92"/>
    <path d="M57 112a17 17 0 0 1-2-34 22 22 0 0 1 42 4.5 18 18 0 0 1-3 29z" fill="#fff"/>
  </g>

  <!-- main dashboard card -->
  <g filter="url(#sh)">
    <rect x="300" y="150" width="700" height="470" rx="28" fill="#ffffff"/>
    <rect x="300" y="150" width="700" height="64" rx="28" fill="#f5f8f6"/>
    <rect x="300" y="186" width="700" height="28" fill="#f5f8f6"/>
    <circle cx="338" cy="182" r="7" fill="#ff5f57"/><circle cx="362" cy="182" r="7" fill="#febc2e"/><circle cx="386" cy="182" r="7" fill="#28c840"/>
    <rect x="430" y="170" width="280" height="24" rx="12" fill="#eef3f0"/>

    <!-- uptime headline -->
    <text x="340" y="285" font-family="Sora, Arial, sans-serif" font-size="22" fill="#6b7a86">Uptime · last 30 days</text>
    <text x="340" y="335" font-family="Sora, Arial, sans-serif" font-size="52" font-weight="800" fill="#0c1c2b">99.99%</text>
    <rect x="780" y="262" width="184" height="40" rx="20" fill="#e6f6ee"/>
    <circle cx="804" cy="282" r="6" fill="#12a150"/>
    <text x="820" y="289" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#0e8a45">Operational</text>

    <!-- area chart -->
    <path d="M340 470 L390 450 L440 458 L490 420 L540 432 L590 398 L640 410 L690 372 L740 388 L790 360 L840 372 L890 344 L960 360 L960 500 L340 500 Z" fill="url(#area)"/>
    <path d="M340 470 L390 450 L440 458 L490 420 L540 432 L590 398 L640 410 L690 372 L740 388 L790 360 L840 372 L890 344 L960 360" stroke="#12a150" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- resource bars -->
    <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#6b7a86">
      <text x="340" y="548">CPU</text><rect x="400" y="538" width="430" height="10" rx="5" fill="#eef3f0"/><rect x="400" y="538" width="150" height="10" rx="5" fill="url(#g1)"/><text x="900" y="548" fill="#0c1c2b" font-weight="600">34%</text>
      <text x="340" y="582">RAM</text><rect x="400" y="572" width="430" height="10" rx="5" fill="#eef3f0"/><rect x="400" y="572" width="230" height="10" rx="5" fill="url(#g1)"/><text x="900" y="582" fill="#0c1c2b" font-weight="600">52%</text>
    </g>
  </g>

  <!-- floating toast -->
  <g filter="url(#sh)" transform="translate(740,560)">
    <rect width="300" height="92" rx="18" fill="#ffffff"/>
    <rect x="20" y="26" width="40" height="40" rx="10" fill="#e6f6ee"/>
    <path d="M33 46l6 6 12-12" stroke="#12a150" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="76" y="44" font-family="Sora, Arial, sans-serif" font-size="18" font-weight="700" fill="#0c1c2b">Deploy successful</text>
    <text x="76" y="68" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6b7a86">build #128 · 1.2s · LiteSpeed</text>
  </g>
</svg>
