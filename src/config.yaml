site:
  name: Royal Clouds
  site: "https://royalclouds.net"
  base: "/"
  trailingSlash: false

  googleSiteVerificationId: false

# Default SEO metadata
metadata:
  title:
    default: Royal Clouds, Premium SSD Web Hosting, KVM VPS & Dedicated Servers
    template: "%s, Royal Clouds"
  description: "Royal Clouds delivers premium SSD web hosting, KVM VPS, CyberPanel VPS, managed WordPress and dedicated servers, built for speed with LiteSpeed, CloudLinux, free cPanel & SSL and friendly 24/7 support."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Royal Clouds
    images:
      - url: "~/assets/images/default.png"
        width: 1200
        height: 628
    type: website
  twitter:
    handle: "@royalclouds"
    site: "@royalclouds"
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: "/blog/%slug%"
      robots:
        index: true

    list:
      isEnabled: true
      pathname: "blog"
      robots:
        index: true

    category:
      isEnabled: true
      pathname: "category"
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: "tag"
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: "light:only"
