<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Royal Clouds — Content Manager</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Absolute config path: the CMS is reached at /admin (no trailing slash),
         where a relative "config.yml" would resolve to /config.yml and 404. -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!-- Sveltia CMS: Git-backed visual editor, Decap-compatible config, works
         on phones. Pinned while it is pre-1.0 — bump the version deliberately
         (https://github.com/sveltia/sveltia-cms/releases). To fall back to
         Decap, swap in https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js
         (desktop-only UI). No type="module" here: Sveltia documents that as
         a common mistake. -->
    <script src="https://unpkg.com/@sveltia/cms@0.205.3/dist/sveltia-cms.js"></script>
  </body>
</html>
