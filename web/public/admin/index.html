<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Royal Clouds — Content Manager</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Absolute config path: the CMS is reached at /admin (no trailing slash),
         where a relative "config.yml" would resolve to /config.yml and 404. -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!-- Decap CMS: Git-backed visual editor. Edits commit to the repo and
         trigger a GitHub Actions rebuild + deploy. No server required. -->
    <script src="https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js"></script>
  </body>
</html>
